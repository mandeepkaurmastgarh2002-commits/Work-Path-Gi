
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Path GI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f7fa;color:#142b45;margin:0;padding:24px}
main{max-width:520px;margin:30px auto;background:white;padding:24px;border-radius:18px;box-shadow:0 5px 25px #0001}
h1{color:#12345a}p{color:#526579}
input,textarea,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #ccd6df;border-radius:9px;font-size:16px}
button{background:#087f83;color:white;border:0;font-weight:bold}
.small{font-size:13px}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Work Path GI</h1>
<p>Show your skills. Let employers discover your work.</p>

<section id="auth">
<h3>Create account or sign in</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create account</button>
<button onclick="login()">Sign in</button>
 <button onclick="resetPassword()">Forgot Password?</button>
</section>

<section id="profile" hidden>
<h3>Your work profile</h3>
<input id="name" placeholder="Full name">
<input id="contact" placeholder="Phone number or email">
<input id="experience" placeholder="Work experience">
<input id="skills" placeholder="Your skills">
<label>Upload a video showing your work</label>
<input id="video" type="file" accept="video/*">
<button onclick="saveProfile()">Save my profile</button>
<button onclick="logout()">Sign out</button>
</section>
<p id="status" class="small"></p>
</main>

<script>
const SUPABASE_URL = "https://gwgdbyamsdmxpyjkarkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_6e_Lc1bkrc6HOCBtTuqUGw_TdSLfE-A";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function message(t){
 document.getElementById("status").textContent=t;
}
function showProfile(user){
 document.getElementById("auth").hidden=!!user;
 document.getElementById("profile").hidden=!user;
}
async function signup(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signUp({email,password});
 if(error){message(error.message);return;}
 if(data.session){
  showProfile(data.user);
  message("Account created. Complete your profile.");
 }else{
  message("Check your email to confirm your account, then sign in.");
 }
}
async function login(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){message(error.message);return;}
 showProfile(data.user);
 message("Welcome! Complete your profile.");
}
async function logout(){
 await db.auth.signOut();
 showProfile(null);
 message("You have signed out.");
}

async function saveProfile(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){message("Please sign in first.");return;}

 const file=document.getElementById("video").files[0];
 let path=null;

 if(file){
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  path=user.id+"/"+Date.now()+"-"+safeName;
  message("Uploading your video...");
  const {error:uploadError}=await db.storage.from("work-videos").upload(path,file);
  if(uploadError){message(uploadError.message);return;}
 }

 const profile={
  id:user.id,
  full_name:document.getElementById("name").value,
  contact:document.getElementById("contact").value,
  experience:document.getElementById("experience").value,
  skills:document.getElementById("skills").value,
  video_url:path,
  role:"job_seeker"
 };

 const {error}=await db.from("profiles").upsert(profile);
 if(error){message("Profile save error: "+error.message);return;}
 message(file ? "Your profile and video have been saved!" : "Your profile has been saved!");
}

(async()=>{
 const {data:{session}}=await db.auth.getSession();
 showProfile(session?.user||null);
})();
</script>
</body>
</html>
